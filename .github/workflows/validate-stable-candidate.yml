name: Validate Stable V1.0 Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - release/stable-v1.0-candidate
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate only
        uses: actions/checkout@v4
      - name: Verify independent static app source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s service-worker.js || test -s sw.js
          echo "Candidate contains its own HTML, manifest, and service worker."
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.webmanifest > /dev/null
# Validation only: intentionally no Pages upload or deployment.
