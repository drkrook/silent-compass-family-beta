name: Snapshot Stable Source for Rollback (No Deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact current Stable main commit
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and record recovery source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js || test -s service-worker.js
          python3 -m json.tool manifest.webmanifest > /dev/null
          mkdir -p "$RUNNER_TEMP/ledovia-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/ledovia-recovery/source-commit.txt"
          git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/ledovia-recovery/stable-source.tar"
          sha256sum "$RUNNER_TEMP/ledovia-recovery/stable-source.tar" > "$RUNNER_TEMP/ledovia-recovery/stable-source.tar.sha256"
          echo "Source repository: drkrook/silent-compass-family-beta" > "$RUNNER_TEMP/ledovia-recovery/README.txt"
          echo "Source branch: main" >> "$RUNNER_TEMP/ledovia-recovery/README.txt"
          echo "This is a repository source snapshot, not a live-site or Supabase backup." >> "$RUNNER_TEMP/ledovia-recovery/README.txt"
          echo "No deployment or rollback was performed." >> "$RUNNER_TEMP/ledovia-recovery/README.txt"
          echo "Stable source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only repository source snapshot prepared; no deployment." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain recovery snapshot artifact
        uses: actions/upload-artifact@v6
        with:
          name: ledovia-stable-source-recovery
          path: ${{ runner.temp }}/ledovia-recovery/
          if-no-files-found: error
          retention-days: 90
# Recovery snapshot only; no Pages publishing, repository writes, or database operations.
