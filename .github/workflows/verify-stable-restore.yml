name: Verify Stable Recovery Restore (No Deploy)
on:
  workflow_dispatch:
    inputs:
      snapshot_run_id:
        description: "Successful Stable snapshot workflow run ID"
        required: true
        type: string
      expected_source_sha:
        description: "Full 40-character Stable source commit SHA"
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  verify-restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source snapshot run and download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.snapshot_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Snapshot run ID must be numeric"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Expected source SHA must be 40 hexadecimal characters"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open("run.json"))
          assert r["status"]=="completed" and r["conclusion"]=="success", "Snapshot run did not succeed"
          assert r["head_branch"]=="main", "Snapshot run was not triggered on Stable main"
          assert r["path"].endswith("/snapshot-stable-rollback.yml"), "Run is not from snapshot workflow"
          assert r["head_sha"].lower()==os.environ["EXPECTED_SHA"].lower(), "Snapshot run commit does not match expected SHA"
          print("Verified snapshot run:",r["id"],"commit:",r["head_sha"])
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > artifacts.json
          python3 - <<'PY'
          import json
          items=[x for x in json.load(open("artifacts.json"))["artifacts"] if x["name"]=="ledovia-stable-source-recovery" and not x["expired"]]
          assert len(items)==1, "Expected exactly one unexpired recovery artifact"
          open("artifact-id.txt","w").write(str(items[0]["id"]))
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(cat artifact-id.txt)/zip" > recovery.zip
          mkdir -p recovery
          unzip -q recovery.zip -d recovery
      - name: Verify archive checksum and restore into isolated temporary directory
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
          RUN_ID: ${{ inputs.snapshot_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd recovery
          # Snapshot checksum was generated with an absolute runner path.
          # Validate the digest against the extracted archive by content, not its old path.
          python3 - <<'PY'
          import hashlib,pathlib,re
          checksum=pathlib.Path("stable-source.tar.sha256").read_text().strip()
          match=re.fullmatch(r"([0-9a-fA-F]{64})\\s+\\*?.+",checksum)
          assert match, "Invalid snapshot checksum format"
          actual=hashlib.sha256(pathlib.Path("stable-source.tar").read_bytes()).hexdigest()
          assert actual.lower()==match.group(1).lower(), "Recovery archive SHA-256 mismatch"
          print("Recovery archive SHA-256 verified")
          PY
          python3 - <<'PY'
          import os,tarfile,pathlib
          expected=os.environ["EXPECTED_SHA"].lower()
          actual=pathlib.Path("source-commit.txt").read_text().strip().lower()
          assert actual==expected, "Recovery archive source commit differs from expected"
          with tarfile.open("stable-source.tar") as t:
              names=t.getmembers()
              for member in names:
                  p=pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and ".." not in p.parts, "Unsafe archive path"
                  assert member.isfile() or member.isdir(), "Unsupported archive entry"
              t.extractall("restored",filter="data")
          root=pathlib.Path("restored")
          assert (root/"index.html").stat().st_size>0, "Missing index.html"
          assert (root/"manifest.webmanifest").stat().st_size>0, "Missing manifest"
          assert (root/"sw.js").is_file() or (root/"service-worker.js").is_file(), "Missing service worker"
          import json
          json.loads((root/"manifest.webmanifest").read_text())
          print("Recovery source verified; restored",sum(p.is_file() for p in root.rglob("*")),"files in temporary workspace")
          PY
          {
            echo "## LEDOVIA recovery restore verification — NO DEPLOYMENT"
            echo "Snapshot run: $RUN_ID"
            echo "Source commit: $EXPECTED_SHA"
            echo "Archive checksum: verified"
            echo "Temporary extraction and basic PWA file validation: passed"
            echo "No production deployment, repository changes, or database restoration."
          } >> "$GITHUB_STEP_SUMMARY"
# Read-only recovery test. No deployment, repository writes, or Supabase access.
